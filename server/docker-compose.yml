version: '2'
services:
  redis:
    image: redis
  mongodb:
    image: mongo
    volumes_from:
      - mongodb_persistent_data
  mongodb_persistent_data:
    image: mongo
    volumes:
      - /data/db
    command: /bin/false
  server:
    container_name: server
    build: .
    volumes:
      - ..:/home/app
    environment:
      WS_HOST: 'http://waffle-server-no-proxy.gapminderdev.org'
      WS_PORT: 80
      REDIS_HOST: 'redis'
      MONGO_URL: 'mongodb://readme:123123@ds033744.mongolab.com:33744/gampinder-tools-dev'
      # MONGO_URL: 'mongodb://mongodb:27017/gapminder-tools'
    ports:
      - '3001:3001'
